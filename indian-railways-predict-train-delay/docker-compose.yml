version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: railway_eta_db
    environment:
      POSTGRES_USER: railway_user
      POSTGRES_PASSWORD: secure_railway_password_2026
      POSTGRES_DB: railway_eta_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railway_user -d railway_eta_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: railway_eta_backend
    environment:
      DATABASE_URL: postgresql+psycopg2://railway_user:secure_railway_password_2026@db:5432/railway_eta_db
      SECRET_KEY: ${SECRET_KEY:-railway-eta-super-secret-key-production-ready-2026}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - .:/dataset

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: railway_eta_frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
